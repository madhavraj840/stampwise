<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stampwise · Shop</title><meta name="theme-color" content="#E4E9EC"><link rel="stylesheet" href="/app.css"></head>
<body><div id="app"></div>
<script src="/brand.js"></script><script src="/icons.js"></script><script src="/common.js"></script>
<script>
let D=null,tab='overview',viewTab='',stab='qr',cq='',cf='all',cs='recent',d1='',d2='',cshow=100,wq='',wshow=100,range='7';
const app=$('#app'),TABS=[['overview','Overview','layout-dashboard'],['approvals','Approvals','inbox'],['customers','Customers','users'],['rewards','Rewards','gift'],['winners','Winners','trophy'],['settings','Settings','settings']];
const bar=r=>`<header class="bar-top"><span class="word">${BRAND}</span><span class="t"></span><span class="side">${r||'Shop dashboard'}</span></header>`;
const TPL=[['Thank you','Hi {name}, thanks for visiting {shop}! You now have {stamps}/{size} stamps. See you soon.'],['Reward ready','Hi {name}, you have a reward waiting at {shop}. Show your card to claim it.'],['Card ready','Hi {name}, your {shop} loyalty card is ready. Open {app} and log in with this number to see it.'],['We miss you','Hi {name}, we miss you at {shop}! Visit us soon to keep collecting stamps.']];

/* ---------- sign in / up ---------- */
let authFails=0;
function authView(mode='login'){
  const su=mode==='signup';D=null;viewTab='';stopLive();
  app.innerHTML=`${bar()}<main class="auth"><span class="lbl">${su?'Free during early access':'Welcome back'}</span><h1>${su?'Create your shop account':'Shop login'}</h1>
  <div style="margin-top:26px">${su?'<label class="lbl">Shop name</label><input id="n" maxlength="80" autocomplete="organization"><label class="lbl">Shop phone (optional)</label><input id="ph" inputmode="numeric" autocomplete="tel">':''}
  <label class="lbl">Email</label><input id="e" type="email" autocomplete="username"><label class="lbl">Password${su?' (min 8 characters)':''}</label><input id="pw" type="password" autocomplete="${su?'new':'current'}-password">
  ${su?'<label class="lbl">Confirm password</label><input id="pw2" type="password" autocomplete="new-password">':''}
  <label class="chk"><input type="checkbox" id="showpw"> Show password</label>
  <button class="btn big full" id="go">${su?'Create account':'Log in'}</button></div>
  ${su?'':`<div id="rs" class="note ${authFails>=2?'':'hide'}" style="margin-top:18px"><b>Forgot your password?</b><div class="sm" style="margin:4px 0 12px;font-weight:400">Send us a reset request on WhatsApp. We will confirm it is you and reset it for you.</div><button class="btn red sm" onclick="resetView()">${ic('brand-whatsapp',20)}Reset password via WhatsApp</button></div>`}
  <p style="text-align:center;margin-top:18px"><a href="#" id="sw" class="sm" style="display:inline-block;padding:10px">${su?'Already have an account? Log in':'New shop? Create an account'}</a></p><p style="text-align:center;margin-top:8px"><a href="/" class="sm mu" style="display:inline-block;padding:10px">Customer? Open your card</a></p></main>`;
  $('#sw').onclick=ev=>{ev.preventDefault();authView(su?'login':'signup')};
  $('#showpw').onchange=ev=>['pw','pw2'].forEach(k=>{const f=$('#'+k);if(f)f.type=ev.target.checked?'text':'password'});
  const submit=async()=>{
    if(su&&$('#pw').value!==$('#pw2').value)return toast('The two passwords do not match');
    $('#go').disabled=true;try{await api(su?'/api/shop/signup':'/api/shop/login','POST',{name:su&&$('#n').value,phone:su&&$('#ph').value,email:$('#e').value,password:$('#pw').value});authFails=0;boot()}catch(x){toast(x.message);$('#go').disabled=false;if(!su&&x.status===401){authFails++;if(authFails>=2)$('#rs').classList.remove('hide')}}};
  $('#go').onclick=submit;
  // NOTE: never return false from a key handler: it cancels the keypress and blocks typing
  ['pw','pw2','e'].forEach(k=>{const f=$('#'+k);if(f)f.addEventListener('keydown',ev=>{if(ev.key==='Enter')submit()})});
}

/* ---------- forgot password: request goes to the owner via WhatsApp, approved in the admin panel ---------- */
function resetView(){
  const em=$('#e')?$('#e').value:'';
  app.innerHTML=`${bar()}<main class="auth"><span class="lbl">Password reset</span><h1>Choose a new password</h1>
  <p class="mu" style="margin:12px 0 22px">Pick the password you want. We will switch to it after confirming this request really comes from you.</p>
  <label class="lbl">Shop email</label><input id="re" type="email" autocomplete="username" value="${esc(em)}"><label class="lbl">New password (min 8 characters)</label><input id="rp" type="password" autocomplete="new-password">
  <label class="lbl">Confirm new password</label><input id="rp2" type="password" autocomplete="new-password">
  <label class="chk"><input type="checkbox" id="rshow"> Show password</label>
  <button class="btn red big full" id="rgo">${ic('brand-whatsapp',22)}Send request on WhatsApp</button><p style="text-align:center;margin-top:16px"><a href="#" id="rback" class="sm" style="display:inline-block;padding:10px">Back to login</a></p></main>`;
  $('#rback').onclick=ev=>{ev.preventDefault();authView()};
  $('#rshow').onchange=ev=>['rp','rp2'].forEach(k=>$('#'+k).type=ev.target.checked?'text':'password');
  $('#rgo').onclick=async()=>{
    if($('#rp').value!==$('#rp2').value)return toast('The two passwords do not match');
    $('#rgo').disabled=true;
    try{const r=await api('/api/shop/reset-request','POST',{email:$('#re').value,password:$('#rp').value});
      const msg=`Hi, please reset my shop password.\nShop email: ${$('#re').value.trim()}\nRequest code: ${r.code}`,link=r.support?`https://wa.me/${r.support}?text=${encodeURIComponent(msg)}`:'';
      app.innerHTML=`${bar()}<main class="auth"><span class="lbl">Request code ${esc(r.code)}</span><h1>One more step</h1>
      <p class="mu" style="margin:12px 0 22px">${link?'Tap the button to send us the WhatsApp message. Send it from the phone number registered with your shop.':'Password reset is not switched on yet. Please contact support directly.'} Once we confirm it is you, log in with the new password you just chose.</p>
      ${link?`<a class="btn red big full" href="${esc(link)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}<p style="text-align:center;margin-top:16px"><a href="#" id="rb2" class="sm" style="display:inline-block;padding:10px">Back to login</a></p></main>`;
      $('#rb2').onclick=ev=>{ev.preventDefault();authFails=0;authView()};if(link)window.open(link,'_blank','noopener');
    }catch(x){toast(x.message);$('#rgo').disabled=false}};
}

/* ---------- data: the dashboard keeps its own copy of customers and rewards (on this device too),
   and asks the server only for what changed since the last sync. Search, sort, filters and counts all run here. ---------- */
const CACHE='shopdata';
const claimsByCust=()=>{const m=new Map(),now=Date.now();for(const l of D.claims.values())if(l.status==='earned'&&new Date(l.expires_at)>now)m.set(l.customer_id,(m.get(l.customer_id)||0)+1);return m};
function saveCache(){const keep=Date.now()-120*864e5; // forget old finished rewards
  for(const[k,l]of D.claims)if(l.status!=='earned'&&new Date(l.redeemed_at||l.expires_at)<keep)D.claims.delete(k);
  store.set(CACHE,{id:D.me.id,me:D.me,rewards:D.rewards,cust:[...D.cust.values()],claims:[...D.claims.values()],c:D.c,l:D.l})}
async function sync(full){
  let changed=false,more=true,page=false;
  while(more){
    const r=await api(`/api/shop/sync?c=${encodeURIComponent(D?.c||'')}&l=${encodeURIComponent(D?.l||'')}${full||!D?'&full=1':''}${page?'&p=1':''}`);page=true;
    if(!D||(r.me&&r.me.id!==D.me.id))D={cust:new Map(),claims:new Map(),pending:[]};
    if(r.me){D.me=r.me;D.rewards=r.rewards;changed=true}
    const newP=r.pending.filter(p=>!D.pending.some(o=>o.id===p.id));if(D.c!==undefined&&newP.length)alertNew(newP[newP.length-1]);
    if(JSON.stringify(r.pending)!==JSON.stringify(D.pending)){D.pending=r.pending.filter(p=>!undoing.has(p.id));changed=true}
    r.cards.forEach(c=>D.cust.set(c.id,c));r.claims.forEach(l=>D.claims.set(l.id,l));if(r.cards.length||r.claims.length)changed=true;
    D.c=r.c;D.l=r.l;more=r.more;full=false;
  }
  if(changed)saveCache();return changed;
}
function alertNew(p){
  try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.18)}catch{}
  if(window.Notification&&Notification.permission==='granted'&&!navigator.serviceWorker?.controller&&document.hidden)new Notification('New stamp request',{body:p.name+' · '+fmtPhone(p.phone)});
}
const refresh=async(force)=>{try{if(await sync(force)||force)paint(force)}catch(e){if(e.status===401)authView()}};
function go(t){tab=t;paint();scrollTo(0,0)}

/* ---------- live updates without keeping a connection open ----------
   1) web push (if allowed): the server pings this device when a request arrives, the page then syncs
   2) fallback: a small sync every 5 s without alerts (60 s with alerts, as a safety net), only while this tab is visible and someone used it in the last 30 minutes */
let liveT,lastAct=Date.now(),idle=false;
const stopLive=()=>clearTimeout(liveT);
const pushOn=()=>!!(D?.me.vapid&&window.Notification&&Notification.permission==='granted'&&store.get('pushsent'));
function live(){stopLive();if(!D||D.me.paused)return;
  liveT=setTimeout(async()=>{if(!document.hidden){if(Date.now()-lastAct>18e5){idle=true;return paint()}await refresh()}live()},pushOn()?6e4:5e3)}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{lastAct=Date.now();if(idle){idle=false;refresh();live();paint()}},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!D.me.paused){lastAct=Date.now();idle=false;refresh();live()}});
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.t==='sync')refresh()});
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
async function enableAlerts(quiet){
  if(!window.Notification){if(!quiet)toast('This browser cannot show alerts. Keep this tab open.');return}
  const p=quiet?Notification.permission:await Notification.requestPermission();if(p!=='granted'){if(!quiet)toast('Alerts are blocked in your browser settings');return}
  if(D.me.vapid&&'serviceWorker' in navigator&&window.PushManager)try{
    const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(D.me.vapid)});
    if(store.get('pushsent')!==sub.endpoint){await api('/api/shop/push','POST',sub.toJSON());store.set('pushsent',sub.endpoint)}
  }catch(e){console.warn('push',e)}
  if(!quiet)toast('Alerts are on for this device');live();paint();
}

/* ---------- shell ---------- */
function mount(){
  app.innerHTML=`${bar()}<div class="dash"><div class="top"><div class="logohead"><span id="hlogo"></span><div><span class="lbl">Shop dashboard</span><h2 id="hname" style="margin-top:2px"></h2></div></div><button class="btn line sm" onclick="signOut()">${ic('logout',20)}Log out</button></div>
  <div id="banner"></div><div class="tabs" id="tabs"></div><div id="view"></div></div><div id="float"></div>`;viewTab='';
}
function paint(force){
  if(!D?.me)return;if(!$('#view'))mount();const m=D.me;
  const n=D.pending.length;document.title=(n?`(${n}) `:'')+BRAND+' · Shop';$('#hname').textContent=m.name;
  $('#hlogo').innerHTML=m.logo_ver?`<img class="logo" alt="" src="/api/logo/${m.id}?v=${m.logo_ver}">`:'';
  $('#banner').innerHTML=m.paused?`<div class="paused"><span>${ic('player-pause',22)} Your loyalty program is paused. Customers cannot collect stamps or redeem rewards.</span><button class="btn sm" onclick="setPaused(false)">${ic('player-play',20)}Resume program</button></div>`
    :idle?`<div class="paused"><span>${ic('clock',22)} Live updates paused while you were away.</span><button class="btn sm" onclick="lastAct=Date.now();idle=false;refresh(1);live()">${ic('refresh',20)}Resume</button></div>`
    :!pushOn()&&m.vapid&&window.Notification&&Notification.permission!=='denied'?`<div class="paused"><span>${ic('bell',22)} Turn on alerts to hear new stamp requests instantly, even when this tab is in the background.</span><button class="btn sm" onclick="enableAlerts()">${ic('bell',20)}Turn on alerts</button></div>`:'';
  $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${ic(i,20)}${l}${k==='approvals'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');
  const f=n&&tab!=='approvals'?D.pending[0]:null;
  $('#float').innerHTML=f?`<div class="float"><span class="lbl">New stamp request${n>1?' · '+(n-1)+' more waiting':''}</span><div class="row" style="margin:8px 0 12px"><div><b>${esc(f.name)}</b><div class="sm" style="color:#B8C5D0">${fmtPhone(f.phone)} · ${f.stamps}/${m.card_size} stamps</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn red sm" onclick="decide(${f.id},'approve')">${ic('check',20)}Approve</button><button class="btn sm" onclick="decide(${f.id},'decline')">${ic('x',20)}Decline</button><button class="btn sm" onclick="go('approvals')">All requests</button></div></div>`:'';
  // forms (rewards/settings) are only rebuilt on tab change or after saving, so typing is never wiped
  if(viewTab===tab&&!force&&(tab==='rewards'||tab==='settings'))return;
  if(viewTab===tab&&tab==='customers'&&$('#clist')&&!force)return list();
  if(viewTab===tab&&tab==='winners'&&$('#wl')&&!force)return $('#wl').innerHTML=wrows();
  if(viewTab===tab&&tab==='overview'&&$('#ov')&&!force)return;
  viewTab=tab;$('#view').innerHTML=({overview,approvals,customers,rewards,winners,settings})[tab]();
  if(tab==='customers')list();if(tab==='overview')loadDays();if(tab==='settings'&&stab==='qr')drawQR();
}

/* ---------- overview: totals from this device's copy, daily numbers from the server's per-day table ---------- */
const istDay=(o=0)=>new Date(Date.now()+19800000-o*864e5).toISOString().slice(0,10);
function chart(vals,labels){const W=600,H=180,P=28,n=vals.length,mx=Math.max(1,...vals),x=i=>P+i*(W-2*P)/Math.max(1,n-1),y=v=>H-26-v*(H-56)/mx,every=Math.ceil(n/8),dots=n<=31;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Chart"><line x1="${P}" x2="${W-P}" y1="${H-26}" y2="${H-26}" stroke="#C9D2D8" stroke-width="2"/><polygon points="${P},${H-26} ${vals.map((v,i)=>x(i)+','+y(v)).join(' ')} ${x(n-1)},${H-26}" fill="rgba(11,107,87,.12)"/><polyline points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#0B6B57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${vals.map((v,i)=>`${dots?`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="#0B6B57" stroke-width="3"/>`:''}${n<=14?`<text x="${x(i)}" y="${y(v)-10}" font-size="12" text-anchor="middle" font-weight="700" fill="#14212C">${v}</text>`:''}${i%every===0||i===n-1?`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#546270">${esc(labels[i])}</text>`:''}`).join('')}</svg>`}
const rangeDates=()=>range==='custom'?[d1o||istDay(29),d2o||istDay()]:[istDay(+range-1),istDay()];
let d1o='',d2o='',daysCache={};
function overview(){
  const all=[...D.cust.values()].filter(c=>!c.removed),rep=all.length?Math.round(all.filter(c=>c.visits>1).length/all.length*100):0,m=D.me;
  const steps=[[D.rewards.length>0,'Add your first reward',"go('rewards')"],[!!store.get('qr'+m.id),'Print or download your QR code',"stab='qr';go('settings')"],[all.some(c=>c.visits>0),'Get your first stamp: ask a customer to scan',"stab='qr';go('settings')"]],todo=steps.filter(s=>!s[0]).length;
  const top=all.slice().sort((a,b)=>b.visits-a.visits).slice(0,10).filter(c=>c.visits>0);
  return `<div id="ov">${todo?`<div class="rule"><h3>Get started (${3-todo} of 3 done)</h3>${steps.map(([ok,t,a])=>`<div class="check ${ok?'done':''}">${ic(ok?'circle-check':'circle',22)}${ok?esc(t):`<a href="#" onclick="${a};return false" style="text-decoration:underline">${esc(t)}</a>`}</div>`).join('')}</div>`:''}
  <div class="row" style="flex-wrap:wrap;gap:10px;margin-bottom:16px"><div class="chips" style="margin:0">${[['7','7 days'],['30','30 days'],['90','90 days'],['custom','Custom']].map(([k,l])=>`<button class="chip ${range===k?'on':''}" onclick="range='${k}';paint(1)">${l}</button>`).join('')}</div>
  ${range==='custom'?`<div style="display:flex;gap:8px;align-items:center"><input type="date" id="o1" value="${rangeDates()[0]}" max="${istDay()}" style="margin:0"><span class="mu">to</span><input type="date" id="o2" value="${rangeDates()[1]}" max="${istDay()}" style="margin:0"><button class="btn sm" onclick="d1o=$('#o1').value;d2o=$('#o2').value;paint(1)">Show</button></div>`:''}</div>
  <div id="ovnums"><p class="mu">Loading…</p></div>
  <div class="g2"><div class="rule"><h3>Top customers (all time)</h3>${top.map((c,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span><b class="mono">${i+1}.</b> ${esc(c.name)} <span class="sm mu">${fmtPhone(c.phone)}</span></span><span class="tag">${c.visits} visits</span></div>`).join('')||'<p class="mu">Your most loyal customers appear here.</p>'}</div>
  <div class="rule"><h3>All customers</h3><div class="g2" style="gap:12px"><div><span class="num" style="font-size:36px">${all.length}</span><span class="lbl">Customers</span></div><div><span class="num" style="font-size:36px">${rep}%</span><span class="lbl">Came back more than once</span></div></div>
    <h3 style="margin-top:18px">Get customers scanning</h3><p class="mu">Show your QR at the counter. Customers can also type your shop code: <b class="mono" style="font-size:22px;letter-spacing:.1em;color:var(--ink)">${esc(m.code)}</b></p><p style="margin-top:12px"><button class="btn sm" onclick="stab='qr';go('settings')">QR code</button></p></div></div></div>`;
}
async function loadDays(){
  const[a,b]=rangeDates(),k=a+b;if(a>b)return $('#ovnums').innerHTML='<p class="mu">The start date is after the end date.</p>';
  try{if(!daysCache[k]||Date.now()-daysCache[k].t>6e4)daysCache[k]={t:Date.now(),rows:await api(`/api/shop/days?from=${a}&to=${b}`)}}catch(e){return $('#ovnums')&&($('#ovnums').innerHTML=`<p class="mu">${esc(e.message)}</p>`)}
  if(!$('#ovnums'))return;const by=Object.fromEntries(daysCache[k].rows.map(r=>[r.day,r])),days=[];
  for(let t=Date.parse(a);t<=Date.parse(b);t+=864e5){const d=new Date(t).toISOString().slice(0,10);days.push(by[d]||{day:d,stamps:0,new_customers:0,earned:0,redeemed:0})}
  const sum=f=>days.reduce((s,d)=>s+d[f],0),earned=sum('earned'),red=sum('redeemed'),lab=days.map(d=>new Date(d.day).toLocaleDateString('en-IN',{day:'numeric',month:'short'})),today=by[istDay()]?.stamps||0;
  $('#ovnums').innerHTML=`<div class="g4"><div><span class="ico">${ic('check',22)}</span><span class="num">${sum('stamps')}</span><span class="lbl">Stamps · today ${today}</span></div><div><span class="ico">${ic('user-plus',22)}</span><span class="num">${sum('new_customers')}</span><span class="lbl">New customers</span></div><div><span class="ico">${ic('gift',22)}</span><span class="num">${earned}</span><span class="lbl">Rewards earned</span></div><div><span class="ico">${ic('trophy',22)}</span><span class="num">${earned?Math.round(red/earned*100):0}%</span><span class="lbl">Redemption rate (${red} used)</span></div></div>
  <div class="g2"><div class="rule"><h3>Stamps per day</h3>${chart(days.map(d=>d.stamps),lab)}</div><div class="rule"><h3>New customers per day</h3>${chart(days.map(d=>d.new_customers),lab)}</div></div>`;
}

/* ---------- approvals ---------- */
function approvals(){
  if(D.me.paused)return `<div class="rule"><div class="empty"><b>Program paused</b>Resume it to receive stamp requests again.</div></div>`;
  return `<div class="rule"><div class="row" style="margin-bottom:6px"><h3>Stamp requests</h3>${D.pending.length>1?`<button class="btn sm" onclick="approveAll()">${ic('check',20)}Approve all (${D.pending.length})</button>`:''}</div>${D.pending.map(r=>`<div class="req"><div><b style="font-size:17px">${esc(r.name)}</b> <span class="mu">${fmtPhone(r.phone)}</span><div class="sm mu">${r.stamps} of ${D.me.card_size} stamps · ${r.visits} visits · ${fmtTime(r.created_at)}</div></div>
    <div style="display:flex;gap:8px"><button class="btn sm" onclick="decide(${r.id},'approve')">${ic('check',20)}Approve</button><button class="btn line sm" onclick="decide(${r.id},'decline')">${ic('x',20)}Decline</button></div></div>`).join('')
    ||`<div class="empty"><b>No pending requests</b>New requests appear here${D.cust.size?'.':'. Print your QR from Settings to get started.'}</div>`}</div>`;
}
const undoing=new Map();
async function decide(id,act){ // optimistic: the row disappears at once
  const row=D.pending.find(p=>p.id===id);D.pending=D.pending.filter(p=>p.id!==id);paint(true);
  if(act==='decline'){ // Undo = the decline is only sent after 5 seconds, so undoing costs nothing
    const t=setTimeout(()=>{undoing.delete(id);api(`/api/shop/requests/${id}/decline`,'POST').catch(e=>toast(e.message))},5e3);undoing.set(id,t);
    $('#float').innerHTML=`<div class="float"><div class="row"><span>Declined ${esc(row?.name||'')}</span><button class="btn sm" id="undo">${ic('arrow-back-up',20)}Undo</button></div></div>`;
    $('#undo').onclick=()=>{clearTimeout(t);undoing.delete(id);if(row)D.pending.push(row);D.pending.sort((a,b)=>a.id-b.id);paint(true)};
    return setTimeout(()=>{if($('#undo'))paint()},5e3);
  }
  try{await api(`/api/shop/requests/${id}/approve`,'POST');toast('Stamp approved');firstApproval()}catch(e){toast(e.message)}refresh(true);
}
async function approveAll(){if(!await ask(`Approve all ${D.pending.length} requests?`,'Each customer gets one stamp.','Approve all'))return;
  try{const r=await api('/api/shop/requests/approve-all','POST');toast(`${r.approved} stamps approved`);firstApproval()}catch(e){toast(e.message)}refresh(true)}
// the first time a stamp is approved on this device, offer alerts (instead of hiding the option in Settings)
function firstApproval(){if(!window.Notification||Notification.permission!=='default'||store.get('askedAlerts'))return;store.set('askedAlerts',1);
  setTimeout(async()=>{if(await ask('Get an alert for new requests?','Your phone or computer will ring when a customer asks for a stamp, even when this tab is in the background.','Turn on alerts'))enableAlerts()},800)}

/* ---------- customers (all filtering happens on this device) ---------- */

/* ---------- add / import customers ---------- */
const normP=v=>{const d=String(v??'').replace(/\D/g,'').replace(/^(91|0)(?=\d{10}$)/,'');return /^[6-9]\d{9}$/.test(d)?d:null};
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){r.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}r.push(f);rows.push(r);return rows.filter(x=>x.some(v=>String(v).trim()))}
const XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const loadXLSX=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=XLSX_SRC;s.integrity='sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==';s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>no(new Error('Could not load the Excel reader. Check your internet, or save the sheet as CSV.'));document.head.append(s)});
function toRecords(rows){
  let m={n:0,p:1,s:2},start=0;const h=rows[0].map(x=>String(x).toLowerCase().trim()),pi=h.findIndex(x=>/phone|mobile|number|contact/.test(x));
  if(pi>=0){start=1;m.p=pi;const ni=h.findIndex(x=>/name|customer/.test(x));m.n=ni>=0?ni:(pi===0?1:0);m.s=h.findIndex(x=>/stamp/.test(x))}
  return rows.slice(start).map((r,i)=>({row:i+start+1,name:String(r[m.n]??'').trim(),phone:r[m.p]??'',stamps:m.s>=0?parseInt(r[m.s])||0:0}));
}

  ${one?`<label class="lbl">Name</label><input id="an" maxlength="60" placeholder="e.g. Rahul Sharma"><label class="lbl">Mobile number</label><input id="ap" inputmode="numeric" placeholder="98765 43210">

  :`<p class="sm mu" style="margin-bottom:12px">Upload a <b>CSV or Excel</b> file with the columns <b>Name, Phone, Stamps</b> (Stamps is optional). A card is created for every number automatically.</p>
    <button class="btn line sm" onclick="tpl()" style="margin-bottom:14px">${ic('download',20)}Download template</button>
    <input type="file" id="af" accept=".csv,.xlsx,.xls,text/csv" style="padding:10px"><div id="ap2"></div>`}
  <p class="sm mu" style="margin-top:14px">Rewards at or below the starting stamps are given on the customer's next stamp. Only add customers who have agreed to hear from you. Nothing is sent to them automatically.</p>`,1);
  if(!one)$('#af').onchange=readFile;else $('#an').focus();

function tpl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Name,Phone,Stamps\nRahul Sharma,9876543210,2\nAsha Verma,9123456780,0\n'],{type:'text/csv'}));a.download='customers-template.csv';a.click()}
async function readFile(ev){
  const f=ev.target.files[0];if(!f)return;const box=$('#ap2');box.innerHTML='<p class="mu">Reading file...</p>';
  try{let rows;if(/\.csv$/i.test(f.name)||f.type==='text/csv')rows=parseCSV(await f.text());
    else{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
    if(!rows.length)throw new Error('The file is empty');
    const rec=toRecords(rows),good=rec.filter(r=>normP(r.phone)),bad=rec.filter(r=>!normP(r.phone));imp=good;
    box.innerHTML=`<div class="note" style="margin-top:14px">${good.length} valid number${good.length===1?'':'s'}${bad.length?` · ${bad.length} to skip`:''}</div>
    ${good.slice(0,4).map(r=>`<div class="sm" style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(r.name||'Customer')} · ${fmtPhone(normP(r.phone))}${r.stamps?` · ${r.stamps} stamps`:''}</div>`).join('')}${good.length>4?`<div class="sm mu" style="padding-top:6px">and ${good.length-4} more</div>`:''}
    ${bad.length?`<p class="sm mu" style="margin-top:10px">Skipped rows: ${bad.slice(0,5).map(r=>'row '+r.row).join(', ')}${bad.length>5?'...':''} (invalid mobile number)</p>`:''}
    ${good.length?`<button class="btn full" style="margin-top:16px" id="doimp" onclick="runImport()">Import ${good.length} customer${good.length===1?'':'s'}</button>`:''}`;
  }catch(e){box.innerHTML=`<div class="note">${esc(e.message)}</div>`}
}

    <h3 style="margin-top:26px">Pause program</h3><p class="mu" style="margin-bottom:12px">On holiday or changing your rewards? Pausing stops stamps, approvals and reward redemptions until you resume. Stamps and rewards are kept.</p>
    ${m.paused?`<button class="btn" onclick="setPaused(false)">${ic('player-play',20)}Resume program</button>`:`<button class="btn line" onclick="setPaused(true)">${ic('player-pause',20)}Pause program</button>`}</div></div>`;
  return sub+`<div class="g2"><div class="rule"><h3>Login email</h3><p class="mu" style="margin-bottom:12px">Now: <b>${esc(m.email)}</b></p><label class="lbl">New email</label><input id="ne" type="email" autocomplete="email"><label class="lbl">Current password</label><input id="ncp" type="password" autocomplete="current-password"><button class="btn" onclick="chEmail()">${ic('mail',20)}Change email</button></div>
    <div class="rule"><h3>Password</h3><label class="lbl">Current password</label><input id="op" type="password" autocomplete="current-password"><label class="lbl">New password (min 8 characters)</label><input id="np" type="password" autocomplete="new-password"><label class="lbl">Confirm new password</label><input id="np2" type="password" autocomplete="new-password">
    <button class="btn" onclick="chPw()">${ic('lock',20)}Change password</button><p class="sm mu" style="margin-top:10px">Changing it signs out your other devices.</p></div>
    <div class="rule"><h3>Devices</h3><p class="mu" style="margin-bottom:12px">Lost a phone, or someone else knows your password? Sign out everywhere except this device (takes effect within an hour).</p><button class="btn line" onclick="logoutAll()">${ic('devices',20)}Log out all other devices</button></div></div>`;
}
function pickG(b){document.querySelectorAll('#gp button').forEach(x=>x.setAttribute('aria-pressed',x===b))}
async function save(){
  const aa=$('#aa').checked;
  if(aa!==D.me.auto_approve&&!await ask(aa?'Turn on auto-approve?':'Turn off auto-approve?',aa?'Every stamp request is approved at once, without staff checking the customer is in the shop. Anyone with your QR code or shop code can collect stamps.':'Each stamp request will wait for staff to approve it.',aa?'Yes, auto-approve':'Turn off'))return;
  try{await api('/api/shop/settings','PATCH',{name:$('#sn').value,phone:$('#sp').value,address:$('#sa').value,hours:$('#sh').value,review_url:$('#rv').value,instagram:$('#ig').value,whatsapp:$('#wa').value,card_size:+$('#sz').value,stamp_icon:($('#gp [aria-pressed=true]')||{dataset:{}}).dataset.g,auto_approve:aa,multi_per_day:$('#mm').checked});toast('Saved');await refresh(true)}catch(e){toast(e.message)}}
async function setPaused(p){
  if(p&&!await ask('Pause your loyalty program?','Customers cannot collect stamps or redeem rewards until you resume. Requests waiting now are closed. Stamps and rewards are kept.','Pause program',1))return;
  try{await api('/api/shop/pause','POST',{paused:p});toast(p?'Program paused':'Program resumed');await refresh(true);live()}catch(e){toast(e.message)}}
/* logo: shrunk to 256 px on this device, so only a few KB are uploaded and the server never processes images */
async function upLogo(f){if(!f)return;try{
  const im=new Image();im.src=URL.createObjectURL(f);await im.decode();const s=256,c=document.createElement('canvas'),k=Math.min(im.width,im.height);c.width=c.height=s;
  c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,s,s);URL.revokeObjectURL(im.src);
  let b=await new Promise(r=>c.toBlob(r,'image/webp',.85));if(!b||b.type!=='image/webp'||b.size>58e3)b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  const r=await fetch('/api/shop/logo',{method:'PUT',headers:{'Content-Type':b.type},body:b}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Upload failed');
  D.me.logo_ver=d.logo_ver;saveCache();toast('Logo updated');paint(1);
}catch(e){toast(e.message==='The source image cannot be decoded.'?'That image could not be read':e.message)}}
async function rmLogo(){if(!await ask('Remove your logo?','',"Remove",1))return;try{await api('/api/shop/logo','DELETE');D.me.logo_ver=0;saveCache();paint(1)}catch(e){toast(e.message)}}
async function chEmail(){try{await api('/api/shop/email','POST',{email:$('#ne').value,current:$('#ncp').value});toast('Email changed');await refresh(true)}catch(e){toast(e.message)}}
async function chPw(){if($('#np').value!==$('#np2').value)return toast('The two passwords do not match');try{await api('/api/shop/password','POST',{current:$('#op').value,password:$('#np').value});toast('Password changed');paint(1)}catch(e){toast(e.message)}}
async function logoutAll(){if(!await ask('Log out all other devices?','Other phones and computers are signed out within an hour. This device stays signed in.','Log out others',1))return;try{await api('/api/shop/logout-all','POST');toast('Other devices will be signed out')}catch(e){toast(e.message)}}
/* QR: drawn on this device, no server work */
const markQR=()=>{store.set('qr'+D.me.id,1)};
async function drawQR(){try{$('#qrimg').innerHTML=await qrSvg(D.me.scan_url,260)}catch(e){$('#qrimg').textContent=e.message}}
function copyLink(){navigator.clipboard.writeText(D.me.scan_url).then(()=>{markQR();toast('Link copied')})}
async function dlQR(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await qrSvg(D.me.scan_url,1024)],{type:'image/svg+xml'}));a.download=D.me.slug+'-qr.svg';a.click();markQR()}
async function printQR(){const m=D.me,svg=await qrSvg(m.scan_url,420),w=open('');if(!w)return toast('Allow pop-ups to print');markQR();
  w.document.write(`<title>${esc(m.name)} QR</title><body style="text-align:center;font-family:Arial,sans-serif;padding:40px"><h1 style="font-size:54px">${esc(m.name)}</h1><h2>Scan to collect stamps</h2>${svg}<p style="font-size:26px;letter-spacing:.15em">Or enter code <b>${esc(m.code)}</b></p>`);w.document.close();setTimeout(()=>w.print(),400)}
async function signOut(){await api('/api/shop/logout','POST').catch(()=>{});store.del(CACHE);store.del('pushsent');D=null;authView()}

/* ---------- boot ---------- */
async function boot(){
  const c=store.get(CACHE);
  if(c?.me){D={me:c.me,rewards:c.rewards,pending:[],cust:new Map(c.cust.map(x=>[x.id,x])),claims:new Map(c.claims.map(x=>[x.id,x])),c:c.c,l:c.l};paint()} // instant first paint
  try{await sync(true)}catch(e){if(e.status===401||!D){store.del(CACHE);return authView()}return toast('Offline: showing saved data')}
  paint(true);live();enableAlerts(true);
}
boot();
</script></body></html>
